<text x="510" y="140" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#222">ST-01 创建</text>
<polyline points="650,260 650,470" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="780" y="375" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#222">ST-02 扫码签到</text>
