<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="1050" viewBox="0 0 1390 1050" aria-label="SM-01-预约主状态图">
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 5 L1 9" fill="none" stroke="#222" stroke-width="1.8"/></marker></defs>
<rect width="1390" height="1050" fill="white"/>
<text x="695.0" y="42" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#222">SM-01  预约主生命周期</text>
<ellipse cx="650.0" cy="87.0" rx="12.0" ry="12.0" fill="#222" stroke="#222" stroke-width="1.8"/>
